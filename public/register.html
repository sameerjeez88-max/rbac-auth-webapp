<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — RBAC Security Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <div class="max-w-md mx-auto my-auto px-6 py-10 w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl">
    <div class="text-center mb-8">
      <div class="bg-indigo-600 text-white font-bold w-12 h-12 mx-auto flex items-center justify-center rounded-xl shadow-lg mb-4 text-xl">RB</div>
      <h1 class="text-2xl font-extrabold tracking-tight">Create Account</h1>
      <p class="text-slate-400 text-xs mt-1">Register new user or administrator</p>
    </div>

    <form id="register-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Full Name</label>
        <input type="text" id="name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Email Address</label>
        <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Password</label>
        <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Role</label>
        <select id="role" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
          <option value="customer">Customer</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition-all shadow-lg shadow-indigo-600/20">
        Register Account
      </button>
    </form>

    <div id="msg" class="mt-4 text-xs text-center text-red-400 hidden"></div>

    <div class="mt-6 text-center text-xs text-slate-400">
      Already have an account? <a href="/login.html" class="text-indigo-400 font-medium hover:underline">Login here</a>
    </div>
  </div>

  <footer class="py-4 text-center text-xs text-slate-500">
    © 2026 Rana Yasir Mahy Ud Din • RBAC Authentication System
  </footer>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const msg = document.getElementById('msg');

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });
        const json = await res.json();

        if (json.success) {
          alert('Registration successful! Please login.');
          window.location.href = '/login.html';
        } else {
          msg.innerText = json.message;
          msg.classList.remove('hidden');
        }
      } catch (err) {
        msg.innerText = "Failed to connect to server.";
        msg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
