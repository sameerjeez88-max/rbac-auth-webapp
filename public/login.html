<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — RBAC Security Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <div class="max-w-md mx-auto my-auto px-6 py-10 w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl">
    <div class="text-center mb-8">
      <div class="bg-indigo-600 text-white font-bold w-12 h-12 mx-auto flex items-center justify-center rounded-xl shadow-lg mb-4 text-xl">RB</div>
      <h1 class="text-2xl font-extrabold tracking-tight">Welcome Back</h1>
      <p class="text-slate-400 text-xs mt-1">Sign in with your JWT credentials</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Email Address</label>
        <input type="email" id="email" required value="admin@fastekdot.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Password</label>
        <input type="password" id="password" required value="password123" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition-all shadow-lg shadow-indigo-600/20">
        Secure Login
      </button>
    </form>

    <div id="msg" class="mt-4 text-xs text-center text-red-400 hidden"></div>

    <div class="mt-6 text-center text-xs text-slate-400">
      Don't have an account? <a href="/register.html" class="text-indigo-400 font-medium hover:underline">Register here</a>
    </div>
    <div class="mt-4 p-3 bg-slate-950/60 rounded-xl border border-slate-800 text-[11px] text-slate-400 space-y-1">
      <p class="font-semibold text-indigo-300">Demo Credentials Pre-filled:</p>
      <p>Admin: admin@fastekdot.com / password123</p>
      <p>User: user@fastekdot.com / password123</p>
    </div>
  </div>

  <footer class="py-4 text-center text-xs text-slate-500">
    © 2026 Rana Yasir Mahy Ud Din • RBAC Authentication System
  </footer>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const json = await res.json();

        if (json.success) {
          localStorage.setItem('token', json.token);
          localStorage.setItem('user', JSON.stringify(json.user));
          window.location.href = '/dashboard.html';
        } else {
          msg.innerText = json.message;
          msg.classList.remove('hidden');
        }
      } catch (err) {
        msg.innerText = "Failed to connect to server.";
        msg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
